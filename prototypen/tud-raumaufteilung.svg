<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" role="img" aria-labelledby="ra-t ra-d" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="10" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#111;max-width:100%">
  <title id="ra-t">Ideale Raumaufteilung der Fachräume TTG</title>
  <desc id="ra-d">Nachbau nach Technik und Design, Grundlagen, S. 185, Abb. 19. Oben drei Räume für Lager und Arbeiten der Schülerinnen und Schüler, darunter ein Korridor. Unten nebeneinander: Universalraum Schwerpunkt Textiles, Multifunktionsraum, Universalraum Schwerpunkt Technisches, Maschinenraum und Metallraum für den 3. Zyklus. Die unteren Räume sind untereinander mit Türen verbunden und haben Zugänge ins Freie.</desc>
  <!-- Obere Reihe: Lager und Arbeitsplätze -->
  <g>
    <rect x="12" y="12" width="110" height="52"/>
    <rect x="122" y="12" width="110" height="52"/>
    <rect x="232" y="12" width="110" height="52"/>
  </g>
  <g fill="currentColor" stroke="none">
    <text x="67" y="30" text-anchor="middle">Lager Material</text>
    <text x="177" y="30" text-anchor="middle">Lager Material</text>
    <text x="287" y="30" text-anchor="middle">Lager Material</text>
  </g>
  <g stroke="none" fill="#e9e9e4"><rect x="18" y="40" width="64" height="14" rx="2"/><rect x="128" y="40" width="64" height="14" rx="2"/><rect x="238" y="40" width="64" height="14" rx="2"/></g>
  <g fill="currentColor" stroke="none" font-size="9">
    <text x="50" y="50.5" text-anchor="middle">SuS Arbeiten</text>
    <text x="160" y="50.5" text-anchor="middle">SuS Arbeiten</text>
    <text x="270" y="50.5" text-anchor="middle">SuS Arbeiten</text>
  </g>
  <!-- Korridor -->
  <path d="M12 64 H528 M12 100 H528"/>
  <path d="M12 64 V100 M528 64 V100" stroke-dasharray="3 3"/>
  <text x="270" y="86" text-anchor="middle" fill="currentColor" stroke="none" font-style="italic">Korridor</text>
  <!-- Untere Reihe: Fachräume -->
  <g>
    <rect x="12" y="100" width="114" height="112"/>
    <rect x="126" y="100" width="108" height="112"/>
    <rect x="234" y="100" width="114" height="112"/>
    <rect x="348" y="100" width="90" height="112"/>
    <rect x="438" y="100" width="90" height="112"/>
  </g>
  <!-- Türen zwischen den Räumen (Lücke mit Viertelkreis) -->
  <g stroke-width="1">
    <g stroke="#fff" stroke-width="3"><path d="M126 175 V198 M234 175 V198 M348 175 V198 M438 175 V198"/></g>
    <path d="M126 175 A23 23 0 0 1 149 198 M234 175 A23 23 0 0 1 257 198 M348 175 A23 23 0 0 1 371 198 M438 175 A23 23 0 0 1 461 198"/>
    <!-- Türen zum Korridor -->
    <g stroke="#fff" stroke-width="3"><path d="M90 100 H112 M200 100 H222 M310 100 H332 M410 100 H432 M496 100 H518 M90 64 H112 M200 64 H222 M310 64 H332"/></g>
    <path d="M90 100 A22 22 0 0 0 112 122 M200 100 A22 22 0 0 0 222 122 M310 100 A22 22 0 0 0 332 122 M410 100 A22 22 0 0 0 432 122 M496 100 A22 22 0 0 0 518 122"/>
    <path d="M90 64 A22 22 0 0 1 112 42 M200 64 A22 22 0 0 1 222 42 M310 64 A22 22 0 0 1 332 42"/>
    <!-- Zugänge ins Freie -->
    <g stroke="#fff" stroke-width="3"><path d="M40 212 H64 M150 212 H174 M262 212 H286 M372 212 H396 M462 212 H486"/></g>
    <path d="M40 212 A24 24 0 0 1 64 236 M150 212 A24 24 0 0 1 174 236 M262 212 A24 24 0 0 1 286 236 M372 212 A24 24 0 0 1 396 236 M462 212 A24 24 0 0 1 486 236" stroke-dasharray="2 2"/>
  </g>
  <g fill="currentColor" stroke="none">
    <text x="20" y="140">Universalraum</text><text x="20" y="153">Schwerpunkt</text><text x="20" y="166">Textiles</text>
    <text x="134" y="140">Multifunktionsraum</text>
    <text x="242" y="140">Universalraum</text><text x="242" y="153">Schwerpunkt</text><text x="242" y="166">Technisches</text>
    <text x="356" y="140">Maschinenraum</text>
    <text x="446" y="140">Metallraum</text><text x="446" y="153">3. Zyklus</text>
    <text x="270" y="246" text-anchor="middle" font-style="italic">Zugänge ins Freie</text>
  </g>
</svg>
